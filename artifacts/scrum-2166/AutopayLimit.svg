<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="816" viewBox="0 0 1720 816" role="img" aria-labelledby="title description">
  <title id="title">C4 · Уровень 2 · ПлатиДом — Автоплатеж с лимитом суммы</title>
  <desc id="description">Клиент работает с мобильным приложением банка. API ПлатиДома обращается к БД и ГИС ЖКХ, отправляет оплату в процессинг карт и отдельно запрашивает сведения об источниках оплаты, средствах и состоянии операции.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#334862"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .heading { fill: #183153; font-weight: 700; }
      .detail { fill: #40546a; font-size: 15px; }
      .node-title { fill: #fff; font-size: 21px; font-weight: 700; }
      .node-detail { fill: #fff; font-size: 15px; }
      .node-type { fill: #e3edf7; font-size: 13px; }
      .call { fill: none; stroke: #334862; stroke-width: 2.4; marker-end: url(#arrow); }
      .status-call { stroke-dasharray: 7 4; }
      .call-text { fill: #263b52; font-size: 15px; font-weight: 600; }
      .call-tech { fill: #40546a; font-size: 13px; }
    </style>
  </defs>

  <rect width="1720" height="816" fill="#fff"/>
  <text x="44" y="47" class="heading" font-size="18">C4 · Уровень 2 · ПлатиДом</text>
  <text x="44" y="91" class="heading" font-size="32">Автоплатеж с лимитом суммы</text>
  <text x="44" y="121" class="detail">Контейнеры и внешние зависимости фичи SCRUM-2166</text>
  <path d="M44 145H1676" stroke="#dce4ee"/>

  <rect x="338" y="169" width="747" height="561" rx="14" fill="#f4f8fc" stroke="#6a829c" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="362" y="206" class="heading" font-size="19">ПлатиДом</text>
  <text x="362" y="228" class="detail">Граница программной системы</text>

  <g id="client" text-anchor="middle">
    <circle cx="122" cy="363" r="23" fill="#183153"/>
    <rect x="44" y="388" width="156" height="119" rx="17" fill="#183153"/>
    <text x="122" y="418" class="node-title">Клиент</text>
    <text x="122" y="440" class="node-type">Пользователь</text>
    <text x="122" y="466" class="node-detail">
      <tspan x="122">Авторизован в</tspan>
      <tspan x="122" dy="19">мобильном банке</tspan>
    </text>
  </g>

  <g id="mobile" text-anchor="middle">
    <rect x="365" y="346" width="178" height="206" rx="19" fill="#1d5681" stroke="#183153" stroke-width="3"/>
    <path d="M438 358h32M441 540h26" stroke="#dceafa" stroke-width="2.5" stroke-linecap="round"/>
    <text x="454" y="388" class="node-title">
      <tspan x="454">Мобильное</tspan>
      <tspan x="454" dy="23">приложение</tspan>
      <tspan x="454" dy="23">банка</tspan>
    </text>
    <text x="454" y="462" class="node-type">Контейнер · iOS / Android</text>
    <text x="454" y="487" class="node-detail">
      <tspan x="454">Настраивает</tspan>
      <tspan x="454" dy="18">автоплатёж и</tspan>
      <tspan x="454" dy="18">показывает историю</tspan>
    </text>
  </g>

  <g id="api" text-anchor="middle">
    <rect x="743" y="348" width="305" height="188" rx="9" fill="#1d5681"/>
    <text x="895.5" y="401" class="node-title">API ПлатиДома</text>
    <text x="895.5" y="424" class="node-type">Контейнер · Java / Spring Boot</text>
    <text x="895.5" y="461" class="node-detail">
      <tspan x="895.5">Управляет правилами, запускает</tspan>
      <tspan x="895.5" dy="20">и отслеживает оплату,</tspan>
      <tspan x="895.5" dy="20">выдаёт историю.</tspan>
    </text>
  </g>

  <g id="db" text-anchor="middle">
    <path d="M743 633C743 610 1048 610 1048 633V689C1048 717 743 717 743 689Z" fill="#1d5681"/>
    <ellipse cx="895.5" cy="633" rx="152.5" ry="15" fill="#3376a6" stroke="#d2e5f5" stroke-width="1.4"/>
    <text x="895.5" y="669" class="node-title">База данных ПлатиДома</text>
    <text x="895.5" y="689" class="node-type">Контейнер · PostgreSQL</text>
    <text x="895.5" y="702" class="node-detail" style="font-size:13px">Привязки, снимки, правила и попытки</text>
  </g>

  <g id="accrualSource" text-anchor="middle">
    <rect x="1394" y="214" width="282" height="151" rx="9" fill="#526276"/>
    <text x="1535" y="254" class="node-title">ГИС ЖКХ</text>
    <text x="1535" y="280" class="node-type">Внешняя программная система</text>
    <text x="1535" y="313" class="node-detail">
      <tspan x="1535">Источник начислений ЖКУ.</tspan>
      <tspan x="1535" dy="21">Учебное допущение A-01.</tspan>
    </text>
  </g>

  <g id="cardProcessing" text-anchor="middle">
    <rect x="1394" y="425" width="282" height="213" rx="9" fill="#526276"/>
    <text x="1535" y="486" class="node-title">Процессинг карт</text>
    <text x="1535" y="511" class="node-type">Внешняя программная система</text>
    <text x="1535" y="548" class="node-detail">
      <tspan x="1535">Принимает команды оплаты,</tspan>
      <tspan x="1535" dy="21">сообщает исход операции.</tspan>
      <tspan x="1535" dy="21">Учебное допущение A-12.</tspan>
    </text>
  </g>

  <g id="relationships">
    <path class="call" d="M200 450H363"/>
    <text x="268" y="332" text-anchor="middle" class="call-text" style="font-size:14px">
      <tspan x="268">Выбирает привязку</tspan>
      <tspan x="268" dy="18">и источник оплаты,</tspan>
      <tspan x="268" dy="18">подтверждает лимит,</tspan>
      <tspan x="268" dy="18">отключает</tspan>
      <tspan x="268" dy="18">правило и смотрит</tspan>
      <tspan x="268" dy="18">историю</tspan>
    </text>
    <text x="268" y="472" text-anchor="middle" class="call-tech">UI</text>

    <path class="call" d="M544 450H742"/>
    <text x="643.5" y="364" text-anchor="middle" class="call-text">
      <tspan x="643.5">Передаёт настройки</tspan>
      <tspan x="643.5" dy="18">и согласие, отключает</tspan>
      <tspan x="643.5" dy="18">правило и читает свои</tspan>
      <tspan x="643.5" dy="18">правила и историю</tspan>
    </text>
    <text x="643.5" y="472" text-anchor="middle" class="call-tech">HTTPS / JSON</text>

    <path class="call" d="M1048 370H1123V344H1393"/>
    <text x="1249" y="287" text-anchor="middle" class="call-text">
      <tspan x="1249">Запрашивает ID, сумму, валюту</tspan>
      <tspan x="1249" dy="18">и состояние начислений</tspan>
      <tspan x="1249" dy="18">по поставщику и счёту</tspan>
    </text>
    <text x="1249" y="365" text-anchor="middle" class="call-tech">API ГИС ЖКХ · контракт уточнить</text>

    <path class="call" d="M1048 443H1393"/>
    <text x="1243" y="390" text-anchor="middle" class="call-text">
      <tspan x="1243">Передаёт команду оплаты</tspan>
      <tspan x="1243" dy="18">с ключом запроса, суммой, валютой</tspan>
      <tspan x="1243" dy="18">и ссылкой на источник оплаты</tspan>
    </text>
    <text x="1243" y="465" text-anchor="middle" class="call-tech">API процессинга · контракт записи уточнить</text>

    <path class="call status-call" d="M1048 514H1116V605H1393"/>
    <text x="1250" y="549" text-anchor="middle" class="call-text">
      <tspan x="1250">Проверяет источник и средства,</tspan>
      <tspan x="1250" dy="18">запрашивает статус по ключу</tspan>
      <tspan x="1250" dy="18">запроса или ID операции</tspan>
    </text>
    <text x="1250" y="627" text-anchor="middle" class="call-tech">API процессинга · контракт чтения уточнить</text>

    <path class="call" d="M895.5 536V617"/>
    <text x="880" y="555" text-anchor="end" class="call-text">
      <tspan x="880">Читает привязки и снимки,</tspan>
      <tspan x="880" dy="18">читает и записывает правила,</tspan>
      <tspan x="880" dy="18">попытки, ключи и исходы</tspan>
    </text>
    <text x="880" y="611" text-anchor="end" class="call-tech">SQL / JDBC</text>
  </g>

  <path d="M44 752H1676" stroke="#dce4ee"/>
  <g id="legend">
    <text x="44" y="786" class="heading" font-size="15">Условные обозначения</text>
    <circle cx="246" cy="781" r="8" fill="#183153"/>
    <text x="263" y="786" class="detail">Пользователь</text>
    <rect x="400" y="773" width="21" height="16" rx="3" fill="#1d5681"/>
    <text x="431" y="786" class="detail">Контейнер</text>
    <rect x="544" y="773" width="21" height="16" rx="3" fill="#526276"/>
    <text x="575" y="786" class="detail">Внешняя система</text>
    <rect x="739" y="772" width="24" height="18" rx="3" fill="none" stroke="#6a829c" stroke-width="1.7" stroke-dasharray="4 3"/>
    <text x="775" y="786" class="detail">Граница ПлатиДома</text>
    <path d="M954 781H982" class="call"/>
    <text x="996" y="786" class="detail">От инициатора к получателю</text>
    <path d="M1224 781H1261" class="call status-call"/>
    <text x="1275" y="786" class="detail">Запросы к процессингу</text>
  </g>
</svg>
