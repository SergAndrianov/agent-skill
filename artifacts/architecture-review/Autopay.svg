<text x="620" y="772" font-size="15" >Запрашивает карты владельца и доступные средства · HTTPS / JSON</text>
<text x="34" y="815" font-size="17" font-weight="700">6</text>
<text x="78" y="815" font-size="15" font-weight="700">Серверное приложение ПлатиДома → Процессинг карт</text>
<text x="620" y="815" font-size="15" >Поручает списание с ключом операции · HTTPS / JSON</text>
<text x="34" y="858" font-size="17" font-weight="700">7</text>
