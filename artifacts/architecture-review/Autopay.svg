<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="810" viewBox="0 0 1530 810"><title>ПлатиДом | C4 L2 | Автоплатеж с лимитом</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#325777"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#163349"><text x="25" y="45" font-size="30" font-weight="700" fill="#163349">ПлатиДом  /  C4 L2  /  Автоплатеж с лимитом</text><text x="25" y="75" font-size="16" font-weight="400" fill="#163349">Учебная архитектура  •  пунктир — граница системы  •  стрелка — инициатор вызова  •  технологии и внешние контракты предложены</text><rect x="440" y="120" width="380" height="620" rx="12" fill="#f6faff" stroke="#517998" stroke-dasharray="9 5"/><text x="461" y="153" font-size="23" font-weight="700" fill="#163349">ПлатиДом</text><rect x="20" y="185" width="270" height="104" rx="34" fill="#eef2f5" stroke="#53738a"/><text x="33" y="208" font-size="14" font-weight="400" fill="#405766">Человек</text><text x="33" y="237" font-size="19" font-weight="700" fill="#163349">Клиент</text><text x="33" y="263" font-size="15" font-weight="400" fill="#163349">Владелец привязки и правила</text><rect x="20" y="410" width="270" height="125" rx="8" fill="#eef2f5" stroke="#53738a"/><text x="33" y="433" font-size="14" font-weight="400" fill="#405766">Внешняя система</text><text x="33" y="462" font-size="19" font-weight="700" fill="#163349">Мобильный банк</text><text x="33" y="488" font-size="15" font-weight="400" fill="#163349">Общее приложение банка с</text><text x="33" y="507" font-size="15" font-weight="400" fill="#163349">экраном ПлатиДома</text><rect x="465" y="365" width="330" height="146" rx="8" fill="#17629a" stroke="#53738a"/><text x="478" y="388" font-size="14" font-weight="400" fill="#d9efff">Java / Spring Boot</text><text x="478" y="417" font-size="17" font-weight="700" fill="white">Серверное приложение ПлатиДома</text><text x="478" y="443" font-size="15" font-weight="400" fill="white">Применяет правила владельца.</text><text x="478" y="462" font-size="15" font-weight="400" fill="white">Обрабатывает начисления и уточняет</text><text x="478" y="481" font-size="15" font-weight="400" fill="white">исход платежа в фоне.</text><rect x="465" y="590" width="330" height="130" rx="8" fill="#17629a" stroke="#53738a"/><text x="478" y="613" font-size="14" font-weight="400" fill="#d9efff">PostgreSQL</text><text x="478" y="642" font-size="19" font-weight="700" fill="white">Хранилище ПлатиДома</text><text x="478" y="668" font-size="15" font-weight="400" fill="white">Хранит правила, согласия, задания и</text><text x="478" y="687" font-size="15" font-weight="400" fill="white">записи попыток с ключами операций.</text><rect x="1210" y="115" width="305" height="125" rx="8" fill="#eef2f5" stroke="#53738a"/><text x="1223" y="138" font-size="14" font-weight="400" fill="#405766">Внешняя система</text><text x="1223" y="167" font-size="19" font-weight="700" fill="#163349">ГИС ЖКХ</text><text x="1223" y="193" font-size="15" font-weight="400" fill="#163349">Источник сведений о начислениях ЖКУ</text><rect x="1210" y="309" width="305" height="125" rx="8" fill="#eef2f5" stroke="#53738a"/><text x="1223" y="332" font-size="14" font-weight="400" fill="#405766">Внешняя система</text><text x="1223" y="361" font-size="19" font-weight="700" fill="#163349">Система карт банка</text><text x="1223" y="387" font-size="15" font-weight="400" fill="#163349">Предоставляет карты клиента и</text><text x="1223" y="406" font-size="15" font-weight="400" fill="#163349">доступные средства</text><rect x="1210" y="554" width="305" height="125" rx="8" fill="#eef2f5" stroke="#53738a"/><text x="1223" y="577" font-size="14" font-weight="400" fill="#405766">Внешняя система</text><text x="1223" y="606" font-size="19" font-weight="700" fill="#163349">Процессинг карт</text><text x="1223" y="632" font-size="15" font-weight="400" fill="#163349">Исполняет платеж и сообщает</text><text x="1223" y="651" font-size="15" font-weight="400" fill="#163349">состояние операции</text><path d="M150 289 V410" stroke="#325777" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="160" y="319" font-size="14" font-weight="400" fill="#163349">Подтверждает правило,</text><text x="160" y="336" font-size="14" font-weight="400" fill="#163349">видит историю</text><text x="160" y="353" font-size="12" font-weight="700" fill="#365b76">UI</text><path d="M290 473 H465" stroke="#325777" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="297" y="389" font-size="14" font-weight="400" fill="#163349">Изменяет правило и</text><text x="297" y="406" font-size="14" font-weight="400" fill="#163349">запрашивает историю</text><text x="297" y="423" font-size="14" font-weight="400" fill="#163349">владельца</text><text x="297" y="440" font-size="12" font-weight="700" fill="#365b76">HTTPS / JSON</text><path d="M788 511 V590" stroke="#325777" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="451" y="530" font-size="14" font-weight="400" fill="#163349">Читает привязку и правило, фиксирует задание, ключ и</text><text x="454" y="549" font-size="14" font-weight="400" fill="#163349">результат попытки</text><text x="454" y="566" font-size="12" font-weight="700" fill="#365b76">PostgreSQL / TLS</text><path d="M795 380 H830 V178 H1210" stroke="#325777" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="857" y="123" font-size="14" font-weight="400" fill="#163349">Запрашивает начисления, сверяет актуальную</text><text x="857" y="140" font-size="14" font-weight="400" fill="#163349">сумму перед оплатой</text><text x="857" y="157" font-size="12" font-weight="700" fill="#365b76">HTTPS</text><path d="M795 410 H855 V373 H1210" stroke="#325777" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="878" y="318" font-size="14" font-weight="400" fill="#163349">Запрашивает карты владельца и доступные</text><text x="878" y="335" font-size="14" font-weight="400" fill="#163349">средства</text><text x="878" y="352" font-size="12" font-weight="700" fill="#365b76">HTTPS / JSON</text><path d="M795 443 H878 V583 H1210" stroke="#325777" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="901" y="529" font-size="14" font-weight="400" fill="#163349">Поручает списание с ключом операции</text><text x="901" y="546" font-size="12" font-weight="700" fill="#365b76">HTTPS / JSON</text><path d="M795 478 H851 V651 H1210" stroke="#325777" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="875" y="683" font-size="14" font-weight="400" fill="#163349">Запрашивает статус исходной операции по</text><text x="875" y="700" font-size="14" font-weight="400" fill="#163349">сохраненному ключу</text><text x="875" y="717" font-size="12" font-weight="700" fill="#365b76">HTTPS / JSON</text></g></svg>
