<text x="34" y="600" font-size="17" font-weight="700">1</text>
<text x="78" y="600" font-size="15" font-weight="700">Клиент → Мобильное приложение банка</text>
<text x="620" y="600" font-size="15" >Подтверждает правило, видит историю · UI</text>
<text x="34" y="643" font-size="17" font-weight="700">2</text>
<text x="78" y="643" font-size="15" font-weight="700">Мобильное приложение банка → Серверное приложение ПлатиДома</text>
<text x="620" y="643" font-size="15" >Изменяет правило и запрашивает историю владельца · HTTPS / JSON</text>
<text x="34" y="686" font-size="17" font-weight="700">3</text>
<text x="78" y="686" font-size="15" font-weight="700">Серверное приложение ПлатиДома → Хранилище ПлатиДома</text>
<text x="620" y="686" font-size="15" >Читает привязку и правило, фиксирует задание, ключ и результат попытки · PostgreSQL / TLS</text>
<text x="34" y="729" font-size="17" font-weight="700">4</text>
<text x="78" y="729" font-size="15" font-weight="700">Серверное приложение ПлатиДома → ГИС ЖКХ</text>
<text x="620" y="729" font-size="15" >Запрашивает начисления, сверяет актуальную сумму перед оплатой · HTTPS</text>
