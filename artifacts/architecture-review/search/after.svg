<text x="32" y="560" font-size="23" font-weight="700">Связи</text>
<text x="34" y="600" font-size="17" font-weight="700">1</text>
<text x="78" y="600" font-size="15" font-weight="700">Клиент → Мобильное приложение банка</text>
<text x="620" y="600" font-size="15" >Ищет, подтверждает привязку, просматривает свои счета</text>
<text x="34" y="643" font-size="17" font-weight="700">2</text>
<text x="78" y="643" font-size="15" font-weight="700">Мобильное приложение банка → Серверное приложение ПлатиДома</text>
<text x="620" y="643" font-size="15" >Запрашивает поиск, сохранение, обновление; получает результаты и ошибки</text>
<text x="34" y="686" font-size="17" font-weight="700">3</text>
<text x="78" y="686" font-size="15" font-weight="700">Серверное приложение ПлатиДома → ГИС ЖКХ</text>
<text x="620" y="686" font-size="15" >Запрашивает начисления по поставщику и счету; обрабатывает ответ или ошибку</text>
<text x="34" y="729" font-size="17" font-weight="700">4</text>
<text x="78" y="729" font-size="15" font-weight="700">Серверное приложение ПлатиДома → Хранилище ПлатиДома</text>
<text x="620" y="729" font-size="15" >Читает привязки; сохраняет уникальные привязки и снимки с временем</text>
<text x="32" y="795" font-size="23" font-weight="700">Ответственность элементов</text>
<text x="34" y="831" font-size="16" font-weight="700">Клиент</text>
<text x="356" y="831" font-size="16" >Пользователь мобильного банка</text>
<text x="34" y="867" font-size="16" font-weight="700">ГИС ЖКХ</text>
<text x="356" y="867" font-size="16" >Внешний источник начислений ЖКУ; A-01</text>
<text x="34" y="903" font-size="16" font-weight="700">Мобильное приложение банка</text>
<text x="356" y="903" font-size="16" >Ввод, результаты, подтверждение привязки и ошибки</text>
<text x="356" y="922" font-size="14" fill="#3b5b6f">Мобильное приложение; стек не определен</text>
<text x="34" y="956" font-size="16" font-weight="700">Серверное приложение ПлатиДома</text>
<text x="356" y="956" font-size="16" >Контроль доступа, валидация, поиск, сохранение без дублей и обновление</text>
<text x="356" y="975" font-size="14" fill="#3b5b6f">Серверное приложение; стек не определен</text>
<text x="34" y="1009" font-size="16" font-weight="700">Хранилище ПлатиДома</text>
<text x="356" y="1009" font-size="16" >Привязки с владельцем, начисления и время успешного обновления</text>
<text x="356" y="1028" font-size="14" fill="#3b5b6f">База данных; СУБД не определена</text>
